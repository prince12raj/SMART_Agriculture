databases:
  - name: smart-agri-db
    plan: free

services:
  - type: web
    name: smart-agriculture
    runtime: python
    rootDir: smart-agriculture-fixed
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smart-agri-db
          property: connectionString

      - key: SECRET_KEY
        generateValue: true

      - key: FLASK_ENV
        value: production

      - key: ANTHROPIC_API_KEY
        sync: false
