services:
  - type: web
    name: smart-agriculture
    runtime: python
    rootDir: smart-agriculture-fixed
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app

    envVars:
      # Paste the Supabase connection string in the Render dashboard (never commit it)
      - key: DATABASE_URL
        sync: false

      - key: SECRET_KEY
        generateValue: true

      - key: FLASK_ENV
        value: production

      - key: ANTHROPIC_API_KEY
        sync: false
